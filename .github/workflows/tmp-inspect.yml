name: tmp inspect live page
on:
  push:
    paths: [".github/workflows/tmp-inspect.yml"]
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sSL https://api.efoilracing.nl/live -o page.html
          python3 - <<'PY'
          import re
          h = open('page.html').read()
          scripts = re.findall(r'<script(?![^>]*src)[^>]*>(.*?)</script>', h, re.S)
          big = max(scripts, key=len)
          print("INLINE SCRIPT LENGTH", len(big))
          print(big)
          PY
      - run: |
          for p in /api/live /live.json /api/live/riders /live/data; do echo "== $p"; curl -sS -m 10 "https://api.efoilracing.nl$p" | head -c 600; echo; done
