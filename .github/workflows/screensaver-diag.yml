name: Screensaver diagnostics
on:
  push:
    paths: ["apps/screensaver-mac/diag/**", ".github/workflows/screensaver-diag.yml"]
jobs:
  diag:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: apps/screensaver-mac/build.sh
      - name: Hidden-window rendering test
        run: swift apps/screensaver-mac/diag/diag.swift "apps/screensaver-mac/build/eFoil Racing Live.saver"
