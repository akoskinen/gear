<title>Axel's Warehouse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F2F5F4;--surface:#FFFFFF;--surface-2:#E9EEEC;--line:#D6DEDB;--ink:#152220;--muted:#5F6E6B;--faint:#8E9B98;
  --accent:#E4572E;--accent-ink:#FFFFFF;--good:#1F8A5B;--good-bg:#E3F3EB;--warn:#B8800A;--warn-bg:#FBF1D8;--crit:#C7372B;--crit-bg:#FBE4E1;
  --shadow:0 1px 2px rgba(21,34,32,.06),0 8px 24px -12px rgba(21,34,32,.18);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--cond:"IBM Plex Sans Condensed","Arial Narrow",var(--sans);--mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ground:#0F1719;--surface:#182224;--surface-2:#1F2B2E;--line:#2C3A3D;--ink:#E8EEEC;--muted:#9FB0AC;--faint:#6E7F7B;--good:#4FC08A;--good-bg:#153126;--warn:#E0A83A;--warn-bg:#3A2E10;--crit:#F07C70;--crit-bg:#3F1D1A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--ground:#0F1719;--surface:#182224;--surface-2:#1F2B2E;--line:#2C3A3D;--ink:#E8EEEC;--muted:#9FB0AC;--faint:#6E7F7B;--good:#4FC08A;--good-bg:#153126;--warn:#E0A83A;--warn-bg:#3A2E10;--crit:#F07C70;--crit-bg:#3F1D1A;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.frame{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--ground);display:flex;flex-direction:column}
.note{font-size:12px;color:var(--muted);padding:10px 16px 0;text-align:center}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding:12px 16px 10px;display:flex;align-items:center;gap:10px;min-height:56px}
header.bar h1{font:600 22px/1.1 var(--cond);margin:0;letter-spacing:.01em;flex:1;text-wrap:balance}
.back{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--muted);margin-left:-8px}
.back:hover{background:var(--surface-2)}
.iconbtn{height:40px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:14px}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.primary{background:var(--accent);color:var(--accent-ink);height:48px;padding:0 20px;border-radius:12px;font:600 15px var(--sans);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.primary:hover{filter:brightness(.95)}
main{padding:0 16px 96px;display:flex;flex-direction:column;gap:20px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:520px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--surface);border-radius:14px;padding:12px 14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:2px;min-height:84px}
.tile .n{font:500 26px/1 var(--mono);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .l{font-size:12.5px;color:var(--muted);line-height:1.3}
.tile.good .n{color:var(--good)}.tile.warn .n{color:var(--warn)}.tile.crit .n{color:var(--crit)}
.tile .sub{font-size:12px;color:var(--faint)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 2px}
.sec-h h2{margin:0;font:600 12px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-h span{font-size:12px;color:var(--faint)}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;border-top:1px solid var(--line);min-height:56px}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .name{font:600 17px/1.15 var(--cond);flex:1;min-width:0}
.row .desc{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;font-family:var(--sans);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .chev{color:var(--faint)}
.row .warnpill{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:3px 8px;border-radius:99px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:10px;display:flex;flex-direction:column;gap:6px;text-align:left;position:relative;min-height:96px;border:2px solid transparent}
.card .code{font:500 13px var(--mono);letter-spacing:.01em}
.card .model{font-size:12px;color:var(--muted);line-height:1.25;flex:1}
.card .dot{width:8px;height:8px;border-radius:50%;background:var(--good);position:absolute;top:10px;right:10px}
.card .dot.check{background:var(--warn)}
.card.board{padding:0;overflow:hidden;min-height:132px}
.card.board .swatch{height:64px;background:var(--sw,#888);position:relative}
.card.board .swatch::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.28),rgba(0,0,0,.12))}
.card.board .body{padding:8px 10px;display:flex;flex-direction:column;gap:3px}
.card.selected,.card.confirmed{border-color:var(--good)}
.card.confirmed::before{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.card.confirmed .dot{display:none}
.card.missing{opacity:.5;border-style:dashed;border-color:var(--line)}
.stock{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);min-height:60px}
.stock:first-child{border-top:0}
.stock .nm{flex:1;min-width:0}
.stock .nm b{font-weight:500;display:block;line-height:1.2}
.stock .nm small{color:var(--faint);font-size:12px;font-family:var(--mono)}
.stock .also{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.stock .qty{font:500 20px var(--mono);font-variant-numeric:tabular-nums;min-width:40px;text-align:right}
.stock .qty.low{color:var(--warn)}
.step{width:44px;height:44px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-size:20px;color:var(--ink)}
.step:active{transform:scale(.96)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:12px 14px 12px 16px;border-radius:12px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);font-size:14px;z-index:20;max-width:calc(100% - 32px)}
.toast button{color:var(--accent);font-weight:600}
.cta{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:4}
.cta .primary{pointer-events:auto;box-shadow:var(--shadow);min-width:200px}
.frame .cta{max-width:560px;margin:0 auto}
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:12px;padding:0 14px;height:48px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;font:inherit;color:inherit;min-width:0;height:100%}
.search input::placeholder{color:var(--faint)}
.group{display:flex;flex-direction:column;gap:6px}
.group .gh{font-size:12px;color:var(--muted);padding:0 2px}
.res{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--surface);border-radius:12px;box-shadow:var(--shadow)}
.res .code{font:500 13px var(--mono);min-width:88px}
.res .where{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.banner{background:var(--surface);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%}
.banner>span:last-child{flex:1;min-width:0}
.banner.walk{border-left:4px solid var(--accent)}
.banner b{display:block;font:600 17px/1.2 var(--cond)}
.banner .p{display:block;margin:4px 0 0;color:var(--muted);font-size:13.5px}
.progress{height:4px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.calm{display:flex;align-items:center;gap:10px;color:var(--good);font-weight:500;padding:6px 2px}
.empty{color:var(--muted);text-align:center;padding:28px 12px;font-size:14px}
.order{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px;font:13px/1.6 var(--mono);white-space:pre-wrap;color:var(--muted)}
.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.summary .tile{min-height:72px}
.hint{font-size:12.5px;color:var(--faint);padding:0 2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const PLACE_ORDER=['Board wall','Wing wall','Row 1','Row 2','Row 3-0','Row 3-1','Row 3-2','Row 4-0','Row 4-1','Row 5-0','Row 5-1','Row 5-2','Cabana','Unknown'];

   '<button class="tile '+(low?'crit':'')+'" onclick="go({s:\'reorder\'})"><span class="n">'+low+'</span><span class="l">to reorder</span></button>'+
  '</div>'+
  (unknown?'<button class="banner" onclick="go({s:\'place\',p:\'Unknown\'})"><span style="color:var(--warn);font-size:20px">⚠</span><span><b>'+unknown+' items have no place</b><span class="p">Boards and a SUP from the sheet with a blank location. Confirm where they live or mark them gone.</span></span></button>':'')+
  '<section class="sec"><div class="sec-h"><h2>Places</h2><span>last walk: not yet</span></div><div class="list">'+
   places.map(p=>'<button class="row" onclick="go({s:\'place\',p:'+JSON.stringify(p).replace(/"/g,'&quot;')+'})"><span class="name">'+esc(p)+'<span class="desc">'+esc(placeSummary(p))+'</span></span>'+(p==='Unknown'?'<span class="warnpill">check</span>':'')+'<span class="chev">›</span></button>').join('')+
  '</div></section>'+
  '<p class="hint">Places are in the order you walk the warehouse. Drag to reorder on the laptop.</p>'+
  '</main>'+
  '<div class="cta"><button class="primary" onclick="startWalk()">Start a walk</button></div>';
}
function cardHTML(i,mode){
  const cls='card'+(i.cat==='board'?' board':'')+(walk&&walk.confirmed.has(i.id)?' confirmed':'')+(walk&&walk.missing.has(i.id)?' missing':'');
  const inner=i.cat==='board'?'<div class="swatch" style="--sw:'+i.sw+'"></div><div class="body"><span class="code">'+i.code+'</span><span class="model">'+esc(i.name)+'</span></div>':'<span class="code">'+i.code+'</span><span class="model">'+esc(i.name)+'</span><span class="dot'+(i.status!=='ready'?' check':'')+'"></span>';
  const on=mode==='walk'?'toggleConfirm(\''+i.id+'\')':'showToast(\''+i.code+' · '+esc(i.name).replace(/'/g,"\\'")+' · opens item detail\')';
  return '<button class="'+cls+'" onclick="'+on+'">'+inner+'</button>';
}
function stockRow(s){
  const also=stock.filter(o=>o.sku===s.sku&&o.id!==s.id&&o.sku);
  return '<div class="stock"><span class="nm"><b>'+esc(s.name)+'</b><small>'+esc(s.sku||'no SKU')+(s.reorder!=null?' · reorder at '+s.reorder:'')+'</small>'+(also.length?'<span class="also">+'+also.map(o=>o.qty+' in '+o.place).join(', ')+'</span>':'')+'</span><span class="qty'+(lowStock(s)?' low':'')+'">'+s.qty+'</span><button class="step" aria-label="One fewer" onclick="adj(\''+s.id+'\',-1)">−</button><button class="step" aria-label="One more" onclick="adj(\''+s.id+'\',1)">+</button></div>';
}
function place(p){
  const it=items.filter(i=>i.place===p),st=stock.filter(s=>s.place===p);
  const inWalk=walk&&walk.current===p;
  let h=header(p,{s:inWalk?'walk':'home'},inWalk?'':'<button class="iconbtn" onclick="showToast(\'Select cards, then Move or Set status.\')">Select</button>');
  h+='<main>';
  if(inWalk){const left=it.filter(i=>!walk.confirmed.has(i.id)&&!walk.missing.has(i.id)).length;
    h+='<div class="banner walk"><span><b>Walk · '+(walk.places.indexOf(p)+1)+' of '+walk.places.length+'</b><span class="p">Tap what you see. '+(left?left+' left to confirm here.':'Everything here is confirmed.')+'</span></span></div>';}
  CATORDER.forEach(c=>{const g=it.filter(i=>i.cat===c);if(!g.length)return;
    h+='<section class="sec"><div class="sec-h"><h2>'+CAT[c]+'</h2><span>'+g.length+'</span></div><div class="cards">'+g.map(i=>cardHTML(i,inWalk?'walk':'view')).join('')+'</div></section>';});
  if(st.length)h+='<section class="sec"><div class="sec-h"><h2>Spares</h2><span>'+st.length+' lines</span></div><div class="list">'+st.map(stockRow).join('')+'</div></section>';
  if(!it.length&&!st.length)h+='<div class="empty">Nothing here.</div>';
  h+='</main>';
  if(inWalk){const left=it.filter(i=>!walk.confirmed.has(i.id)&&!walk.missing.has(i.id)).length;
    h+='<div class="cta"><button class="primary" onclick="'+(left?'confirmAll()':'nextPlace()')+'">'+(left?'Everything here ✓':(walk.places.indexOf(p)<walk.places.length-1?'Next place ›':'Finish walk'))+'</button></div>';}
  return h;
}
function walkView(){
  const done=walk.places.filter(p=>walk.done.has(p)).length;
  return header('Walk the warehouse',{s:'home'})+'<main>'+
  '<div class="banner walk"><span style="flex:1"><b>'+done+' of '+walk.places.length+' places</b><span class="p">'+walk.confirmed.size+' confirmed · '+walk.missing.size+' missing · '+walk.adjust+' counts changed</span><div class="progress" style="margin-top:10px"><i style="width:'+(100*done/walk.places.length)+'%"></i></div></span></div>'+
  '<div class="list">'+walk.places.map(p=>'<button class="row" onclick="walk.current='+JSON.stringify(p).replace(/"/g,'&quot;')+';go({s:\'place\',p:'+JSON.stringify(p).replace(/"/g,'&quot;')+'})"><span class="name">'+esc(p)+'<span class="desc">'+esc(placeSummary(p))+'</span></span>'+(walk.done.has(p)?'<span style="color:var(--good);font-weight:600">✓</span>':'<span class="chev">›</span>')+'</button>').join('')+'</div>'+
  '</main><div class="cta"><button class="primary" onclick="finishWalk()">'+(done===walk.places.length?'Finish walk':'Finish early')+'</button></div>';
}
function doneView(){
  const w=walk;
  return header('Walk done',{s:'home'})+'<main>'+
  '<div class="calm">✓ Inventory is up to date</div>'+
  '<div class="summary"><div class="tile good"><span class="n">'+w.confirmed.size+'</span><span class="l">seen</span></div><div class="tile '+(w.missing.size?'crit':'')+'"><span class="n">'+w.missing.size+'</span><span class="l">missing</span></div><div class="tile"><span class="n">'+w.adjust+'</span><span class="l">counts changed</span></div><div class="tile"><span class="n">'+Math.max(1,Math.round((Date.now()-w.started)/60000))+'</span><span class="l">minutes</span></div></div>'+
  (w.missing.size?'<section class="sec"><div class="sec-h"><h2>Missing</h2></div><div class="list">'+[...w.missing].map(id=>{const i=items.find(x=>x.id===id);return '<div class="row"><span class="name" style="font-family:var(--mono);font-size:14px;font-weight:500">'+i.code+'<span class="desc">'+esc(i.name)+' · was in '+esc(i.home)+'</span></span><span class="warnpill">moved to Unknown</span></div>';}).join('')+'</div></section>':'')+
  '<p class="hint">You can undo this whole walk for the next hour from the history.</p>'+
  '</main><div class="cta"><button class="primary" onclick="walk=null;go({s:\'home\'})">Back to inventory</button></div>';
}
function reorder(){
  const low=stock.filter(lowStock);
  const text=low.map(s=>(s.sku||'—').padEnd(14)+' '+s.name+'  ×'+Math.max(1,(s.reorder??1)-s.qty+1)).join('\n');
  return header('Reorder',{s:'home'})+'<main>'+
  (low.length?'<div class="list">'+low.map(s=>'<div class="stock"><span class="nm"><b>'+esc(s.name)+'</b><small>'+esc(s.sku||'no SKU')+' · have '+s.qty+(s.reorder!=null?', reorder at '+s.reorder:'')+'</small></span><span class="qty low">'+s.qty+'</span></div>').join('')+'</div>'+
  '<section class="sec"><div class="sec-h"><h2>Order for Lift</h2><span>plain text</span></div><div class="order">'+esc(text)+'</div></section>':'<div class="calm">✓ Nothing to reorder</div>')+
  '</main>'+(low.length?'<div class="cta"><button class="primary" onclick="showToast(\'Copied. Paste it into the email to Lift.\')">Copy as order</button></div>':'');
}
function away(){
  const out=items.filter(i=>i.place!==i.home);
  return header('Away from home',{s:'home'})+'<main>'+(out.length?'<div class="cards">'+out.map(i=>cardHTML(i,'view')).join('')+'</div>':'<div class="calm">✓ Everything is home</div><p class="hint">After an event this shows anything still at the site, in the van, or with a rider.</p>')+'</main>';
}
function search(){
  const q=query.trim().toLowerCase();
  const hitI=q?items.filter(i=>(i.code+' '+i.name+' '+i.sku).toLowerCase().includes(q)):[];
  const hitS=q?stock.filter(s=>(s.name+' '+s.sku).toLowerCase().includes(q)):[];
  let h=header('Search',{s:'home'})+'<main><div class="search">⌕<input id="q" placeholder="florence, bat-0, 21 flow, 99118…" value="'+esc(query)+'" oninput="query=this.value;renderKeepFocus()" autocomplete="off"></div>';
  if(!q)h+='<p class="hint">Matches label codes, SKUs, models, sizes and colours. Results show where each thing is.</p>';
  else if(!hitI.length&&!hitS.length)h+='<div class="empty">Nothing matches “'+esc(query)+'”.</div>';
  else{
    const byCat={};hitI.forEach(i=>(byCat[i.cat]=byCat[i.cat]||[]).push(i));
    CATORDER.forEach(c=>{if(!byCat[c])return;const g=byCat[c];
      // group identical models so 15 wings are one line
      const models={};g.forEach(i=>(models[i.name]=models[i.name]||[]).push(i));
      h+='<div class="group"><div class="gh">'+CAT[c]+' · '+g.length+'</div>'+Object.entries(models).map(([n,arr])=>arr.length>3?'<div class="res"><span class="code">'+arr[0].code+'…'+arr[arr.length-1].code.split('-').pop()+'</span><span>'+esc(n)+' <span style="color:var(--muted)">× '+arr.length+'</span></span><span class="where">'+esc(arr[0].place)+'</span></div>':arr.map(i=>'<div class="res"><span class="code">'+i.code+'</span><span>'+esc(i.name)+'</span><span class="where">'+esc(i.place)+'</span></div>').join('')).join('')+'</div>';});
    if(hitS.length)h+='<div class="group"><div class="gh">Spares · '+hitS.length+'</div>'+hitS.map(s=>'<div class="res"><span class="code">'+esc(s.sku||'—')+'</span><span>'+esc(s.name)+' <span style="color:var(--muted)">× '+s.qty+'</span></span><span class="where">'+esc(s.place)+'</span></div>').join('')+'</div>';
  }
  return h+'</main>';
}
// ---------- actions ----------
function adj(id,d){const s=stock.find(x=>x.id===id);if(s.qty+d<0)return;s.qty+=d;if(walk)walk.adjust++;showToast(s.name+': now '+s.qty,()=>{s.qty-=d;if(walk)walk.adjust--;toast=null;render();});}
function startWalk(){walk={places:[...places],current:places[0],confirmed:new Set(),missing:new Set(),done:new Set(),adjust:0,started:Date.now()};go({s:'place',p:places[0]});}
function toggleConfirm(id){if(walk.confirmed.has(id))walk.confirmed.delete(id);else{walk.confirmed.add(id);walk.missing.delete(id);}render();}
function confirmAll(){items.filter(i=>i.place===walk.current).forEach(i=>{walk.confirmed.add(i.id);walk.missing.delete(i.id);});render();}
function nextPlace(){const p=walk.current;items.filter(i=>i.place===p&&!walk.confirmed.has(i.id)).forEach(i=>{walk.missing.add(i.id);});walk.done.add(p);const idx=walk.places.indexOf(p);if(idx<walk.places.length-1){walk.current=walk.places[idx+1];go({s:'place',p:walk.current});}else finishWalk();}
function finishWalk(){walk.missing.forEach(id=>{const i=items.find(x=>x.id===id);i.place='Unknown';});walk.confirmed.forEach(id=>{items.find(x=>x.id===id).seen=Date.now();});go({s:'done'});}
// ---------- render ----------
function render(){const app=document.getElementById('app');let h='';
  switch(route.s){case 'home':h=home();break;case 'place':h=place(route.p);break;case 'walk':h=walkView();break;case 'done':h=doneView();break;case 'reorder':h=reorder();break;case 'away':h=away();break;case 'search':h=search();break;}
  if(toast)h+='<div class="toast" role="status">'+esc(toast.msg)+(toast.undo?'<button onclick="toast.undo()">Undo</button>':'')+'</div>';
  app.innerHTML=h;}
function renderKeepFocus(){const pos=document.getElementById('q').selectionStart;render();const q=document.getElementById('q');q.focus();q.setSelectionRange(pos,pos);}
render();
</script>
